<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 這兩行讓網頁在手機上表現得像原生 App，防止縮放並隱藏瀏覽器介面 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>微甜日常記錄</title>
    
    <style>
        /* 莫蘭迪色系與圓角設計 (UI/UX 核心) */
        :root {
            --bg-color: #F0EAE3; /* 燕麥奶白背景 */
            --card-bg: #FFFFFF;
            --primary-color: #B4A598; /* 霧面奶茶色 (主色調) */
            --button-disabled: #D1CDCB;
            --text-main: #5C544F;
            --text-hint: #9C9691;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center; /* 讓內容在畫面上水平置中 */
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: 32px; /* 大圓角減壓設計 */
            padding: 30px 20px;
            box-shadow: 0 8px 24px rgba(180, 165, 152, 0.15); /* 柔和的陰影 */
        }

        h2 {
            text-align: center;
            font-weight: 500;
            margin-bottom: 24px;
        }

        /* 200字輸入框樣式 */
        textarea {
            width: 100%;
            height: 180px;
            background: #F9F8F6;
            border: 1px solid #E5E0DA;
            border-radius: 20px;
            padding: 16px;
            font-size: 16px;
            box-sizing: border-box; /* 確保 padding 不會撐破寬度 */
            resize: none; /* 禁止使用者隨意拉大輸入框 */
            outline: none;
            color: var(--text-main);
        }

        textarea:focus {
            border-color: var(--primary-color);
        }

        .word-count {
            text-align: right;
            font-size: 14px;
            color: var(--text-hint);
            margin-top: 8px;
            margin-bottom: 20px;
        }

        /* 檔案上傳按鈕樣式 */
        .file-upload {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F9F8F6;
            border: 2px dashed #D1CDCB;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            cursor: pointer;
            color: var(--text-hint);
        }

        /* 隱藏原本醜醜的上傳按鈕 */
        .file-upload input {
            display: none;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            border-radius: 100px; /* 全圓角膠囊按鈕 */
            border: none;
            background: var(--primary-color);
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:disabled {
            background: var(--button-disabled);
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h2>今日份的紀錄 ☁️</h2>
    
    <textarea id="postContent" placeholder="寫下至少 200 字的想法..."></textarea>
    <div class="word-count" id="wordCount">0/200</div>

    <label class="file-upload">
        <input type="file" id="photoUpload" accept="image/*">
        <span id="fileName">＋ 上傳一張今日照片</span>
    </label>

    <button class="submit-btn" id="submitBtn" disabled>完成打卡</button>
</div>

<script>
    // == 1. 請將下面的網址換成你在步驟三取得的 Web App URL ==
    const googleApiUrl = 'https://script.google.com/macros/s/AKfycbyTMA7RTVDM6JxcFQ-f_23g01onusY8uxeK5pOeQuIES_T7EQzoFy-5WjAJ8Gd-Dhe9cQ/exec';

    // == 2. 介面互動與字數統計邏輯 ==
    const content = document.getElementById('postContent');
    const wordCount = document.getElementById('wordCount');
    const photoUpload = document.getElementById('photoUpload');
    const fileName = document.getElementById('fileName');
    const submitBtn = document.getElementById('submitBtn');

    let currentLength = 0;
    let hasPhoto = false;

    // 監聽文字輸入，更新字數統計
    content.addEventListener('input', function() {
        currentLength = this.value.length;
        wordCount.innerText = `${currentLength}/200`;
        checkConditions();
    });

    // 監聽照片上傳，更新檔名顯示
    photoUpload.addEventListener('change', function() {
        if(this.files.length > 0) {
            fileName.innerText = '📸 ' + this.files[0].name;
            hasPhoto = true;
        } else {
            fileName.innerText = '＋ 上傳一張今日照片';
            hasPhoto = false;
        }
        checkConditions();
    });

    // 檢查是否達到送出條件：至少 200 字且有上傳照片
    function checkConditions() {
        if(currentLength >= 200 && hasPhoto) {
            submitBtn.disabled = false; // 啟用按鈕
        } else {
            submitBtn.disabled = true;  // 禁用按鈕
        }
    }

    // == 3. 上傳資料到 Google Drive 與 Google 試算表 ==
    submitBtn.addEventListener('click', async function() {
        submitBtn.innerText = '上傳中...請稍候';
        submitBtn.disabled = true;

        const file = photoUpload.files[0];
        
        // 將圖片轉換成 Base64 格式，Google Apps Script 才能處理
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = async function() {
            const base64Image = reader.result;

            // 準備要傳送給 Google 的資料包
            const payload = {
                content: content.value,
                image: base64Image
            };

            try {
                // 發送請求給 Google Apps Script API
            const response = await fetch(googleApiUrl, {
                method: 'POST',
                redirect: 'follow', // 允許跟隨 Google 的重新導向
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8', // 偽裝成純文字以避開 CORS 預檢攔截
                },
                body: JSON.stringify(payload)
            });

                const result = await response.json();
                
                if(result.status === 'success') {
                    alert('打卡成功！已存入雲端紀錄 ☁️');
                    window.location.reload(); // 成功後重整畫面，準備迎接隔天的打卡
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                alert('發生錯誤：' + error.message);
                submitBtn.innerText = '完成打卡';
                submitBtn.disabled = false;
            }
        };
    });
</script>
</body>
</html>
